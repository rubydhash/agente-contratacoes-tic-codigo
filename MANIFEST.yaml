# MANIFEST — índice e estado de todas as seções do DFD, do ETP e do TR.
# Este é o PRIMEIRO arquivo a ser carregado por qualquer agente em uma sessão.
# Carregar só o MANIFEST + a seção alvo + o checklist YAML correspondente
# economiza ordens de magnitude em tokens versus carregar o documento inteiro.
#
# Status válidos: rascunho | revisao | aprovado
# Convenção de commits: <area>(<slug-da-secao>): <mensagem curta>

projeto:
  objeto_curto: "<preencher em etp/00-metadados.yaml>"
  objeto_fonte_canonica: "etp/00-metadados.yaml > contratacao.descricao_publica"
  versao_repo: "1.0.0"
  data_inicio: "<AAAA-MM-DD>"

# Documento de Formalização da Demanda — fase de Levantamento de Demandas,
# antecede ETP e TR. Conteúdo mínimo: Decreto nº 10.947/2022 art. 8º (I a VIII);
# IN SGD/ME nº 94/2022 art. 10 §1º (a a h).
sections_dfd:
  - path: dfd/00-metadados.yaml
    tipo: metadados
    status: rascunho
  - path: dfd/01-dfd.md
    fonte: "Decreto 10.947/2022 art. 8º (I a VIII); IN 94/2022 art. 10 §1º (a a h); Lei 14.133/2021 art. 12 §1º"
    status: rascunho

